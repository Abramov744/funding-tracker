<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Гостевые входы — Funding Tracker</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    .back-link { color: var(--muted); text-decoration: none; font-size: 13px; }
    .back-link:hover { color: var(--accent); }
    .stat { font-size: 28px; font-weight: 700; margin: 4px 0 20px; }
    table.log { border-collapse: collapse; width: 100%; max-width: 520px; }
    table.log th, table.log td {
      text-align: left;
      padding: 6px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    table.log th { color: var(--muted); font-weight: 500; }
  </style>
</head>
<body>
  <header>
    <p><a class="back-link" href="/">← к сканеру</a></p>
    <h1>Гостевые входы</h1>
    <p class="subtitle">Каждый раз, когда кто-то входит по паролю <code>guest</code>, здесь появляется запись со временем входа.</p>
  </header>

  <div id="content">
    <p class="stat" id="count">—</p>
    <table class="log">
      <thead><tr><th>Когда</th><th>IP</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <p id="empty" class="empty-state" hidden>Пока не было ни одного входа по гостевому паролю.</p>
  </div>
  <p id="forbidden" class="error-banner" hidden>Доступно только с основным паролем.</p>

  <script>
    (async () => {
      const res = await fetch('/api/guest-logins');
      if (res.status === 403) {
        document.getElementById('content').hidden = true;
        document.getElementById('forbidden').hidden = false;
        return;
      }
      const data = await res.json();
      document.getElementById('count').textContent = `Всего входов: ${data.count}`;
      const rows = document.getElementById('rows');
      const entries = [...data.entries].reverse(); // newest first
      for (const e of entries) {
        const tr = document.createElement('tr');
        const time = new Date(e.time).toLocaleString('ru-RU');
        tr.innerHTML = `<td>${time}</td><td>${e.ip || '—'}</td>`;
        rows.appendChild(tr);
      }
      document.getElementById('empty').hidden = entries.length > 0;
    })();
  </script>
</body>
</html>
