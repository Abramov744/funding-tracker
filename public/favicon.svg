<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="neon" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="blur1" />
      <feGaussianBlur stdDeviation="5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="lineGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#28e0c8" />
      <stop offset="100%" stop-color="#3ddc97" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="12" fill="#05070a" />

  <g filter="url(#neon)">
    <polyline points="8,46 20,38 28,42 38,24 46,28 56,10"
      fill="none" stroke="url(#lineGrad)" stroke-width="4"
      stroke-linecap="round" stroke-linejoin="round" />
    <path d="M47,10 L56,10 L56,19" fill="none" stroke="#3ddc97" stroke-width="4"
      stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
